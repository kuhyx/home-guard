# Pre-commit Configuration for home-guard
# Run `pre-commit install` after cloning: pre-commit hooks are not automatic.
# Install:  scripts/install_hooks.sh   (pre-commit + pre-push + the version-bump wrapper)
# Run:      pre-commit run --all-files
# Update:   pre-commit autoupdate

default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        # Shared fakes, not test modules.
        exclude: ^home_guard/tests/(fake_remote_store|fake_tk_root|conftest)\.py$
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: requirements-txt-fixer

  - repo: local
    hooks:
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          - --skip=*.json,*.lock,.git,__pycache__,.venv

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: bash -c 'printf "%s\0" "$@" | xargs -0 -n 40 shellcheck --severity=warning' --
        language: system
        types: [shell]

      # The clean-venv CI mirror (pytest + pre-commit --all-files + the
      # Flutter analyze/test gates for app/), run before every push so a red
      # CI is caught locally. Same script diet-guard runs.
      - id: ci-mirror-venv
        name: CI mirror 1 (clean venv)
        entry: bash scripts/ci_mirror.sh venv
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-precommit
        name: CI mirror 2 (pre-commit --all-files)
        entry: bash scripts/ci_mirror.sh precommit
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-pytest
        name: CI mirror 3 (pytest, xvfb, 100% cov)
        entry: bash scripts/ci_mirror.sh pytest
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-analyze
        name: CI mirror 4 (flutter analyze)
        entry: bash scripts/ci_mirror.sh flutter-analyze
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-1
        name: CI mirror 5 (flutter test 1/6)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 0/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-2
        name: CI mirror 6 (flutter test 2/6)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 1/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-3
        name: CI mirror 7 (flutter test 3/6)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 2/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-4
        name: CI mirror 8 (flutter test 4/6)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 3/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-5
        name: CI mirror 9 (flutter test 5/6)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 4/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-6
        name: CI mirror 10 (flutter test 6/6)
        entry: bash scripts/ci_mirror.sh flutter-test --shard 5/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # A local `dependency_overrides: crdt_sync: path:` pins the phone app to
      # an unpublished library state; every sibling app blocks it the same way.
      - id: crdt-sync-override
        name: no local crdt_sync dependency_override
        entry: bash scripts/check_no_crdt_sync_override.sh app/pubspec.yaml
        language: system
        pass_filenames: false
        always_run: true

      # The shared 250-line cap. Checks only the files in the commit, so an
      # unrelated commit never breaks; exits 1 rather than warning. No
      # baseline and no allowlist -- those are suppressions.
      - id: file-length
        name: file length <= 250 lines
        entry: scripts/check_file_length.sh
        language: system

      # Four markdown namespaces (README / CLAUDE* / DOCS* / TODO*), plus the
      # rule that a TODO carries "REMOVE ME AFTER FINISH" and nothing else may.
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      - id: todo-closer
        name: close Todo trailer tasks
        entry: scripts/todo_hooks.sh closer
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-merge
        name: import PR Todo sections (pull)
        entry: scripts/todo_hooks.sh import-pr post-merge
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-rewrite
        name: import PR Todo sections (pull --rebase)
        entry: scripts/todo_hooks.sh import-pr post-rewrite
        language: system
        stages: [post-rewrite]
        always_run: true
        pass_filenames: false

      # Every dependency on its ecosystem's newest STABLE release,
      # exact-pinned so the question is mechanically answerable at all.
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pubspec\.(yaml|lock)|pyproject\.toml|requirements.*\.txt|uv\.lock
          |package\.json|package-lock\.json|pnpm-lock\.yaml
          |Cargo\.(toml|lock)|go\.(mod|sum)
          |\.fvmrc|\.nvmrc|\.python-version
          |\.github/workflows/.*\.ya?ml)$

  - repo: local
    hooks:
      # The only pre-push hook. Everything that used to run here is now
      # `stages: [manual]` -- run on demand with `scripts/check_gate_stamp.sh
      # full`, and by CI on every push. finish_auto.sh stamps HEAD after its
      # gate; a tree without that receipt cannot leave the machine.
      - id: gate-stamp
        name: pushed tree passed the local gate (stamp check)
        entry: scripts/check_gate_stamp.sh check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$|(^|/)(AndroidManifest\.xml|build\.gradle(\.kts)?|strings\.xml|pubspec\.yaml|repo-contract\.toml|[^/]+\.desktop|assets/icon/[^/]+\.png)$
