name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v10.2.0

      # Every hook brings its own environment except the language: system
      # ones; of those only dependency-freshness imports third-party code
      # (pyyaml, packaging), and shellcheck is on the runner image. The whole
      # requirements.txt used to be installed here for nothing (24 s).
      - name: Install pre-commit and the system hooks' imports
        run: uv pip install --system pre-commit pyyaml packaging

      # The file-length hook delegates to the shared gate in kuhyx/utils, which
      # a runner does not have at $HOME/utils. Check it out and point the shim
      # at it via UTILS_ROOT, or `pre-commit run --all-files` fails on a
      # missing checker rather than on anything in this repo. `.utils` is in
      # the gate's own EXCLUDED_DIRS, so it does not lint itself.
      - name: Check out the shared gate
        uses: actions/checkout@v4
        with:
          repository: kuhyx/utils
          path: .utils

      # One job, not a matrix: no hook here is heavy (slowest measured
      # locally: dependency-freshness 1.5 s, codespell 1.3 s), so extra
      # runners would only add their own startup time. Run pre-commit
      # directly with an explicit hook-env cache instead of pre-commit/action,
      # the same command that action ran.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit run --all-files
        env:
          UTILS_ROOT: ${{ github.workspace }}/.utils
        run: pre-commit run --all-files --show-diff-on-failure --color=always
